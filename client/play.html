<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Voice Racer</title>
  <link rel="icon" href="/brand/Twilio_Logo_Bug_White.svg" />
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="./racer.css" />
</head>
<body>
  <div id="app">
    <div id="split-labels" class="split-labels" aria-label="Split-screen racers" hidden>
      <div class="split-player">
        <div class="split-player-card"><span id="split-role-1">Player 1</span><strong id="split-name-1"></strong></div>
      </div>
      <div class="split-player">
        <div class="split-player-card"><span id="split-role-2">Player 2</span><strong id="split-name-2"></strong></div>
      </div>
    </div>
    <!-- Keep the scene veil and menu in the same stacking context: the QR/name menu
         must remain visible while optional 3D assets assemble behind it. -->
    <div id="veil">
      <img src="/brand/Twilio_Logo_Bug_White.svg" alt="" />
      <div class="veil-eyebrow">Twilio</div>
      <div id="veil-title" class="veil-title">Voice Racer</div>
      <div class="veil-bar"><span></span></div>
    </div>
  </div>

  <a class="game-home" href="/" aria-label="Return to Twilio Games home">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6" />
    </svg>
    <span>Home</span>
  </a>

  <!-- In-game HUD (hidden while a menu screen is up via body.in-menu) -->
  <div id="hud" class="hud-pill">
    <img class="brandbug" src="/brand/Twilio_Logo_Bug_White.svg" alt="" />
    <span id="hud-title" class="htitle">Voice Racer</span>
  </div>
  <div id="hint" class="hud-pill">
    <span id="hint-shout" class="me">Shout</span>
    <span id="hint-left" class="say">“left”</span> <span id="hint-right" class="say">“right”</span> ·
    <span id="hint-boost" class="say">“boost”</span> · <span id="hint-brake" class="say">“brake”</span> ·
    <span id="hint-nitro" class="say pw">“nitro”</span>
  </div>

  <!-- Personal in-race gauges (power charge + boost/brake). Shown ONLY for a real local player
       (solo keyboard, or the shared screen after P-to-play); hidden on a spectator/shared display
       so it isn't an ambiguous distraction with several phone players watching one screen. main.ts
       toggles #gauge.show and paints it from the local car's snapshot each frame. -->
  <div id="gauge">
    <div class="g-power" id="gPower">
      <span class="g-orb" id="gOrb" aria-hidden="true"></span>
      <span class="g-label" id="gPowerLabel">NITRO READY</span>
    </div>
    <div class="g-boost" id="gBoost" title="boost / brake">
      <span class="g-tick brake"></span>
      <div class="g-bar"><span id="gBoostFill"></span></div>
      <span class="g-tick boost"></span>
    </div>
  </div>

  <div id="big" role="status" aria-live="assertive"></div>

  <!-- Legacy lobby overlay retired; the Screens overlay (built in main.ts) handles all menu states. -->
  <div id="lobby" style="display:none"></div>

  <div id="ticker" aria-live="polite"></div>
  <div id="music-toggle-container"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
